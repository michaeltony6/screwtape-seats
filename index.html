<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screwtape Letters Seats</title>
<meta name="description" content="The Screwtape Letters was on Thursday, November 5, 2026. Seat picking has closed.">
<meta name="theme-color" content="#120c1c">
<meta property="og:title" content="The Screwtape Letters: seat picking has closed">
<meta property="og:description" content="The show was on Thursday, November 5, 2026, at NBPAC.">
<meta property="og:image" content="https://michaeltony6.github.io/screwtape-seats/occm-logo.png">
<meta property="og:site_name" content="OCCM Rutgers New Brunswick">
<link rel="apple-touch-icon" href="occm-logo.png">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120c1c'/%3E%3Crect x='7' y='9' width='18' height='13' rx='3' fill='%238f5fd6'/%3E%3Crect x='5' y='20' width='22' height='4' rx='2' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@400;600;700&display=swap">
<style>
  /* The house lights are back up: same look as the seat picker, with no map and no names. */
  :root {
    --bg: #120c1c;
    --line: rgba(243, 238, 250, 0.18);
    --fg: #f3eefa;
    --fg-2: #bdb2cf;
    --open-hi: #a87cf0;
    --font-display: "Fraunces", Georgia, serif;
    --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
    background-image: radial-gradient(120% 60% at 50% -10%, rgba(143, 95, 214, 0.22), transparent 60%);
    background-repeat: no-repeat; min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 34px max(16px, env(safe-area-inset-right, 0px)) max(34px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  /* the OCCM seal is navy on transparent, so it sits on a white disc */
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .seal { flex: none; width: 60px; height: 60px; padding: 3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(179, 140, 255, 0.18), 0 8px 22px rgba(0, 0, 0, 0.4); }
  .org { margin: 0 0 3px; font-size: 15px; font-weight: 600; }
  .eyebrow { margin: 0; font-size: 12.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--open-hi); }
  h1 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 6.4vw, 3.6rem); line-height: 1.02; letter-spacing: -0.01em; text-wrap: balance; }
  .meta { margin: 10px 0 0; color: var(--fg-2); font-size: 16.5px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .closed { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--line); font-size: 18px; }
  .closed b { font-weight: 600; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <img class="seal" src="occm-logo.png" width="60" height="60" alt="Orthodox Christian Campus Ministries, Rutgers New Brunswick">
      <div><p class="org">OCCM · Rutgers New Brunswick</p><p class="eyebrow">Group seats · NBPAC</p></div>
    </div>
    <h1>The Screwtape Letters</h1>
    <p class="meta"><b>Thursday, November 5, 2026</b><br>Elizabeth Ross Johnson Theater · New Brunswick</p>
    <p class="closed"><b>The show is over, and seat picking has closed.</b> Thanks to everyone who came.</p>
  </main>
  <script>
    // the picker saved each visitor's ID and last name on their device; clear it on their next visit
    try { localStorage.removeItem('screwtape-seat-v2'); } catch (e) { /* private mode */ }
  </script>
</body>
</html>
